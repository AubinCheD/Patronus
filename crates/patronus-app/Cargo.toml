[package]
name = "patronus-app"
description = "Patronus — agents autonomes et tâches récurrentes pour le développeur"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "patronus_app"
path = "src/lib.rs"

[[bin]]
name = "patronus"
path = "src/main.rs"

[dependencies]
patronus-core.workspace = true
eframe.workspace = true
egui.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
epaint = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
